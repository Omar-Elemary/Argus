# Fellows Phase 1 — API, web, Postgres (pgvector), Redis.
#
#   docker compose up --build
#
# API: http://localhost:8000
# Web: http://localhost:3000

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fellows
      POSTGRES_PASSWORD: fellows
      POSTGRES_DB: fellows
    ports:
      - "5432:5432"
    volumes:
      - fellows_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fellows -d fellows"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: fellows
      ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      DATABASE_URL: postgresql+asyncpg://fellows:fellows@postgres:5432/fellows
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      LLM_PROVIDER: none
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  fellows_pg:
